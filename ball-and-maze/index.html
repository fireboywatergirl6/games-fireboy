	<div id="topControls">

	<script type="text/javascript">
		window.addEventListener('load', function () {
			var soundBtn = document.getElementById('soundToggleBtn');
			var soundIcon = document.getElementById('soundToggleIcon');
			var isMuted = false;
			var runtime = null;
			var pendingMute = null;
			var SOUND_ICON_ON = "images/sound_on.png";
			var SOUND_ICON_OFF = "images/sound_off.png";

			function updateButton() {
				if (isMuted) {
					soundIcon.src = SOUND_ICON_OFF;
					soundBtn.setAttribute("aria-label", "Sound: off");
					soundBtn.title = "Sound: off";
					soundBtn.style.backgroundColor = "rgba(255, 0, 0, 0.6)";
				} else {
					soundIcon.src = SOUND_ICON_ON;
					soundBtn.setAttribute("aria-label", "Sound: on");
					soundBtn.title = "Sound: on";
					soundBtn.style.backgroundColor = "rgba(0, 0, 0, 0.6)";
				}
			}

			function applyMuteState() {
				if (runtime && runtime.objects && runtime.objects.Audio) {
					try {
						runtime.objects.Audio.isSilent = isMuted;
						return true;
					} catch (err) {
						console.warn("Failed to toggle audio:", err);
						return false;
					}
				}
				pendingMute = isMuted;
				return false;
			}

			if (window.runOnStartup) {
				window.runOnStartup(function (rt) {
					runtime = rt;
					if (runtime.objects && runtime.objects.Audio) {
						if (pendingMute !== null) {
							runtime.objects.Audio.isSilent = pendingMute;
							pendingMute = null;
						}
						isMuted = !!runtime.objects.Audio.isSilent;
					}
					updateButton();
				});
			}
			if (window.C3Audio_DOMInterface && typeof window.C3Audio_DOMInterface.IsSilent === "function") {
				isMuted = !!window.C3Audio_DOMInterface.IsSilent();
			}

			soundBtn.onclick = function () {
				isMuted = !isMuted;
				applyMuteState();
				updateButton();
			};

			updateButton();

			var controls = document.getElementById("topControls");
			var backBtn = document.getElementById("backBtn") ||
				document.getElementById("backButton") ||
				document.querySelector(".back-button");
			if (controls && backBtn && backBtn.parentElement !== controls) {
				controls.insertBefore(backBtn, soundBtn);
			}
		});
	</script>

	<script>
		window.__pauseDepth = 0;
		window.pauseAll = () => {
			window.__pauseDepth += 1;
			if (window.__pauseDepth !== 1) {
				return;
			}
			if (window.SDK_OPTIONS && typeof window.SDK_OPTIONS.onEvent === "function") {
				window.SDK_OPTIONS.onEvent({ name: "SDK_GAME_PAUSE" });
			}
		};
		window.resumeAll = () => {
			if (window.__pauseDepth > 0) {
				window.__pauseDepth -= 1;
			}
			if (window.__pauseDepth !== 0) {
				return;
			}
			if (window.SDK_OPTIONS && typeof window.SDK_OPTIONS.onEvent === "function") {
				window.SDK_OPTIONS.onEvent({ name: "SDK_GAME_START" });
			}
		};

					if (typeof gdsdk !== 'undefined' && gdsdk.showAd !== 'undefined'){

					}

					setTimeout(() => {
						//开声音

						resolve();
					}, 100);
				});
			},
			showReward(e) {
				return new Promise((resolve) => {
					console.trace("[wv] 激励");
					//静音
					//window.pauseAll();
					//播放激励
					if (gdsdk !== 'undefined' && gdsdk.showAd !== 'undefined') {
						gdsdk.showAd('rewarded').then(response => {
							// Ad process done. You can track "SDK_REWARDED_WATCH_COMPLETE" event if that event triggered, that means the user watched the advertisement completely, you can give reward there.
							console.log(String(response.args.success))
							if (String(response.args.success).includes("true") == true) {
								// Ad process done. You can track "SDK_REWARDED_WATCH_COMPLETE" event if that event triggered, that means the user watched the advertisement completely, you can give reward there.
								// rewardedSucess();发奖励
								console.log("[wv] 获取奖励成功");
								setTimeout(() => {
									if (window.SDK_OPTIONS && typeof window.SDK_OPTIONS.onEvent === "function") {
										window.SDK_OPTIONS.onEvent({ name: "COMPLETE" });
									}
									// 开声音
									//window.resumeAll(e);
									resolve(true);
								}, 100);
								
							}else{
								console.log("[wv] 获取奖励失败");
							}
						}).catch(error => {
							// An error catched. Please don't give reward here.
							console.log("[wv] 获取奖励失败");
						});
					}

					
				   });
			},
		};
